# Prevents Supabase's free-tier pause: free projects auto-pause after 7 days
# without API requests. A daily ping to the deployed app keeps it alive.
name: Uptime ping

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Set the SITE_URL repository secret (e.g. https://skillmatch.vercel.app) to enable this job."
            exit 0
          fi
          curl -fsS -o /dev/null -w "Pinged %{http_code}\n" "$SITE_URL" || exit 1